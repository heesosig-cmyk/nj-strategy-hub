name: Collect public research feeds
on:
  workflow_dispatch:
  schedule:
    - cron: '43 0,6,12 * * *'
permissions:
  contents: write
concurrency:
  group: nj-research-feed
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install KRIT HTML parser
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Collect KRIT public board metadata
        continue-on-error: true
        run: python collector/collect_krit.py
      - name: Collect configured public RSS and Atom feeds and merge KRIT
        run: python collector/collect_research.py
      - name: Commit updated research feeds
        run: |
          git config user.name 'nj-feed-bot'
          git config user.email 'nj-feed-bot@users.noreply.github.com'
          git add docs/research.json
          if [ -f docs/krit.json ]; then git add docs/krit.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update public research feeds'
            git pull --rebase
            git push
          fi

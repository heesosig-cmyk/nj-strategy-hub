/* v5.3: panoramic strategy banner, distinctive NJ wordmark */
.brand-type strong{color:#73dcff!important;text-shadow:0 0 12px #27b7e655}
.brand-type span{color:#ffcf57!important;font-weight:900;letter-spacing:.55px}
.brand{padding-top:19px;padding-bottom:19px}
.hero{background-image:linear-gradient(90deg,#092c56 0%,#104575 26%,#0c4575bb 40%,#0b3c6c16 62%,transparent 100%),var(--hero-image)!important;background-size:100% 100%,76% 100%!important;background-position:center,right center!important;background-repeat:no-repeat!important}
.hero h1{color:#fff;max-width:750px;text-shadow:0 2px 12px #08244466}
@media(max-width:1150px){.hero{background-size:100% 100%,72% 100%!important;background-position:center,right center!important}}
@media(max-width:750px){.hero{background-image:linear-gradient(90deg,#092c56 0%,#104575 50%,#0c4575a8 75%,transparent 100%),var(--hero-image)!important;background-size:100% 100%,90% 100%!important}.hero h1{max-width:70%}}

/* v5.4: high contrast branding and full-height dashboard */
html,body{min-height:100%;background:#eaf1fa!important}
main{background:#eaf1fa!important;min-height:100vh}
.content{background:#eaf1fa!important;min-height:calc(100vh - 165px);padding-bottom:24px}
.brand{background:linear-gradient(125deg,#0b3866,#071e3a)!important;border-bottom:3px solid #35c8f4!important}
.nj-emblem{background:linear-gradient(145deg,#17d0f0,#0866b6)!important;border:2px solid #9beaff!important;box-shadow:0 0 0 4px #0b5a8b77,0 0 22px #26d5ff77!important}
.brand-type strong{color:#fff3a4!important;font-size:31px!important;text-shadow:0 0 14px #f6cc3e55!important}
.brand-type span{color:#ffda55!important;font-size:15px!important;letter-spacing:.35px!important}
.brand-row{gap:14px}
.dashboard{align-items:stretch}
.dashboard .panel{min-height:195px}
.dashboard .panel:nth-child(n+3){min-height:225px}
.dashboard-bottom{display:grid;grid-template-columns:1.06fr 1fr;gap:12px;margin-top:12px}
.dashboard-bottom .panel{min-height:170px}
.dashboard-bottom .panel h2{margin-bottom:10px}
.dashboard-bottom .empty{padding:22px 12px}

 const url=input?.value.trim()||'';
 if(!/^https:\/\/[a-z0-9.-]+\.github\.io\/[a-z0-9._/-]+\/notices\.json$/i.test(url)){message.textContent='GitHub Pages의 HTTPS notices.json 주소를 확인해 주세요.';return}

  document.getElementById('nj-feed-list').innerHTML=njFeedItems.length?njFeedItems.map((x,i)=>{

  }).join(''):'<div class="empty">아직 수집된 공고가 없습니다. GitHub Actions 실행 결과를 확인하세요.</div>';
 }catch(e){message.textContent='가져오기 실패: '+e.message+' · GitHub Pages 공개 여부, URL 및 Actions 실행 상태를 확인하세요.'}
}

function opportunityRanked(){
 let items=db.opportunities.filter(x=>JSON.stringify(x).toLowerCase().includes(search.toLowerCase())&&(oppFilter==='전체'||x.status===oppFilter));
 if(oppPriority==='우선 검토')items=items.filter(x=>opportunityScore(x)!==null&&opportunityScore(x)>=80&&opportunityEligibility(x)!=='불충족');

 const date=(x)=>x.due||'9999-12-31';
 items.sort((a,b)=>oppSort==='평가점수순'?(opportunityScore(b)??-1)-(opportunityScore(a)??-1)||date(a).localeCompare(date(b)):oppSort==='예산높은순'?(Number(b.budget??b.assessment?.budget)||0)-(Number(a.budget??a.assessment?.budget)||0)||date(a).localeCompare(date(b)):oppSort==='최근등록순'?(b.updated||'').localeCompare(a.updated||''):date(a).localeCompare(date(b)));

}

const score=x.assessment?scoreAssessment(a):null;
document.getElementById('modal-root').innerHTML=`<div class="modal-wrap"><div class="modal workplan-modal"><h2>연구과제 수주 가능성 평가</h2><p class="subtle">${esc(x.title)} · 평가 결과는 자체 검토용이며 실제 선정확률이 아닙니다.</p><div class="assessment-summary">참여자격: ${esc(eligibilityLabel(x))} · 내부 점수: ${score===null?'미평가':score+' / 100점'} ${score===null?'':score>=80?'· 우선 검토':score>=60?'· 조건부 검토':'· 추가 검토 필요'}</div><form onsubmit="saveAssessment(event,'${id}')"><div class="form-grid">${selects}<label>사업예산(원)<input type="number" name="budget" min="0" step="1" value="${esc(x.budget??a.budget??'')}" placeholder="예: 150000000"></label><label>입찰자격 검증 결과 (점수와 별개)<select name="qualification"><option ${a.qualification==='미확인'?'selected':''}>미확인</option><option ${a.qualification==='충족'?'selected':''}>충족</option><option ${a.qualification==='일부 미충족'?'selected':''}>일부 미충족</option><option ${a.qualification==='불충족'?'selected':''}>불충족</option></select></label><label style="grid-column:1/-1">자격요건 확인 근거·공고 조항<textarea name="qualificationEvidence" rows="2" placeholder="공고문 조항, 충족 여부 판단 근거, 필요한 증빙">${esc(a.qualificationEvidence||'')}</textarea></label><label style="grid-column:1/-1">평가 근거·보완과제<textarea name="notes" rows="3" placeholder="공고문 조항, 증빙 필요사항, 협력기관 확보 등">${esc(a.notes||'')}</textarea></label></div><p class="subtle">점수는 5개 항목의 가중합입니다. '부적격'은 점수와 무관하게 참여 보류로 분류합니다. '일부 미충족'은 공동수급·증빙 보완 등 가능성을 별도로 확인해야 합니다. 공식 공고문 확인이 우선입니다.</p><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">닫기</button><button class="btn primary" type="submit">평가 저장</button></div></form></div></div>`}
function saveAssessment(e,id){e.preventDefault();const x=db.opportunities.find(v=>v.id===id);if(!x)return;const a=Object.fromEntries(new FormData(e.target).entries());for(const k of ['fit','eligibility','capacity','competition','profit'])a[k]=Math.max(0,Math.min(5,Number(a[k])||0));a.updated=new Date().toISOString();x.assessment=a;if(a.budget!==''&&a.budget!=null)x.budget=a.budget;x.updated=a.updated;save();closeModal();render()}
function openWorkplan(kind,id){
 const x=db[kind].find(v=>v.id===id);if(!x)return;
 if(!Array.isArray(x.tasks))x.tasks=[];
 const tasks=x.tasks.slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
 const done=x.tasks.filter(t=>t.status==='완료').length;
 const pct=x.tasks.length?Math.round(done/x.tasks.length*100):0;
 document.getElementById('modal-root').innerHTML=`<div class="modal-wrap"><div class="modal workplan-modal">
 <h2>일정·마일스톤·담당자 관리</h2><p class="subtle"><b>${esc(x.title)}</b> · 업무 ${x.tasks.length}건 / 완료 ${done}건 (${pct}%)</p>
 <div class="workplan-meter"><div style="width:${pct}%"></div></div>
 <div class="workplan-list">${tasks.length?tasks.map(t=>`<div class="workplan-task"><div><b>${esc(t.title)}</b><div class="subtle">담당: ${esc(t.owner||'미지정')} · 기한: ${esc(t.due||'미정')} · ${esc(t.status||'예정')}</div>${t.memo?`<div class="subtle">${esc(t.memo)}</div>`:''}</div><div class="quick"><button type="button" onclick="toggleWorkTask('${kind}','${id}','${t.id}')">${t.status==='완료'?'↶ 재개':'✓ 완료'}</button><button type="button" onclick="deleteWorkTask('${kind}','${id}','${t.id}')">삭제</button></div></div>`).join(''):'<div class="empty">등록된 세부 일정이 없습니다. 아래에서 첫 업무를 추가하세요.</div>'}</div>
 <h3>새 세부 업무 등록</h3><form onsubmit="addWorkTask(event,'${kind}','${id}')"><div class="form-grid">
 <label>업무·산출물명<input name="title" required maxlength="150" placeholder="예: 제안서 초안 작성"></label>
 <label>담당자·협력기관<input name="owner" maxlength="120" placeholder="예: 연구책임자 / 외부 전문가"></label>
 <label>마감일<input type="date" name="due"></label>
 <label>진행상태<select name="status"><option>예정</option><option>진행 중</option><option>검토 중</option><option>완료</option></select></label>
 <label style="grid-column:1/-1">메모·산출물 위치<input name="memo" maxlength="500" placeholder="필요 자료, 전달 사항, 파일 경로 등"></label></div>
 <div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">닫기</button><button class="btn primary" type="submit">+ 세부 업무 추가</button></div></form>
 <p class="subtle">업무 완료율은 세부 업무 기준으로 계산됩니다. 과제의 공식 진도율은 기존 '수정' 화면에서 별도로 관리합니다.</p></div></div>`;
}
function addWorkTask(e,kind,id){
 e.preventDefault();const x=db[kind].find(v=>v.id===id);if(!x)return;
 const d=Object.fromEntries(new FormData(e.target).entries());d.title=(d.title||'').trim();if(!d.title)return;
 if(!Array.isArray(x.tasks))x.tasks=[];d.id='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);x.tasks.push(d);x.updated=new Date().toISOString();save();openWorkplan(kind,id);
}
function toggleWorkTask(kind,id,taskId){
 const x=db[kind].find(v=>v.id===id);const t=x?.tasks?.find(v=>v.id===taskId);if(!t)return;
 t.status=t.status==='완료'?'진행 중':'완료';x.updated=new Date().toISOString();save();openWorkplan(kind,id);
}
function deleteWorkTask(kind,id,taskId){
 if(!confirm('이 세부 업무를 삭제하시겠습니까?'))return;
 const x=db[kind].find(v=>v.id===id);if(!x)return;
 x.tasks=(x.tasks||[]).filter(t=>t.id!==taskId);x.updated=new Date().toISOString();save();openWorkplan(kind,id);
}

function markCandidate(id){let x=db.opportunities.find(x=>x.id===id);if(x){x.status="예비후보";x.updated=new Date().toISOString();save();render()}}
function archiveResult(kind,id){const x=db[kind].find(v=>v.id===id);if(!x)return;if(x.status!=='완료'){alert('완료 상태에서만 실적 등록이 가능합니다.');return;}if(db.records.some(r=>r.sourceKind===kind&&r.sourceId===id)){alert('이미 등록된 실적입니다.');return;}if(!confirm('완료된 과제를 실적·레퍼런스에 등록하시겠습니까?'))return;db.records.push({id:'ref'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),sourceKind:kind,sourceId:id,title:x.title,agency:x.agency||'',category:kind==='opportunities'?'연구과제':x.category==='기고·논문'?'기고·논문':x.category==='컨설팅'?'컨설팅':'연구과제',due:x.completedAt||new Date().toISOString().slice(0,10),direction:[x.direction,x.finalReport?'증빙: '+x.finalReport:'',x.inspection?'검수: '+x.inspection:'',x.settlement?'정산: '+x.settlement:''].filter(Boolean).join(' | '),updated:new Date().toISOString()});save();go('records')}
function removeItem(kind,id){if(!confirm('이 기록을 삭제하시겠습니까?'))return;db[kind]=db[kind].filter(x=>x.id!==id);save();render()}
function promote(kind,id){let x=db[kind].find(x=>x.id===id);if(!x)return;if(db.projects.some(p=>p.sourceId===id)){alert('이미 전환된 프로젝트가 있습니다. 프로젝트 관리에서 확인해 주세요.');return;}if(!confirm('이 항목을 실제 수행 프로젝트로 전환하시겠습니까? 원본 기록도 유지됩니다.'))return;db.projects.push({id:'p'+Date.now().toString(36),title:x.title,agency:x.agency||'',category:kind==='writing'?'기고·논문':kind==='opportunities'?'연구과제':'기타',status:'준비',due:x.due||'',progress:'0',direction:x.direction||'',sourceId:id,tasks:Array.isArray(x.tasks)?x.tasks.map(t=>({...t})):[],updated:new Date().toISOString()});if(kind==='writing')x.status='추진 중';if(kind==='ideas')x.status='추진 확정';if(kind==='opportunities'&&!x.status)x.status='제안 준비';save();render();alert('프로젝트 등록이 완료되었습니다. 현재 화면에서 계속 관리할 수 있습니다.');}
function exportData(){let obj={format:'DRH',version:1,exportedAt:new Date().toISOString(),data:db};let url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='defense-research-hub-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function importData(input){let f=input.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.format!=='DRH'||!obj.data||Object.keys(db).some(k=>!Array.isArray(obj.data[k])))throw Error('호환되지 않는 백업 형식');let count=Object.values(obj.data).reduce((n,x)=>n+x.length,0);if(!confirm(`백업 ${count}건을 복원하고 현재 데이터를 모두 교체하시겠습니까?`))return;db=obj.data;save();render();alert('복원이 완료되었습니다.')}catch(e){alert('복원 실패: '+e.message)}input.value=''}
// Manual CSV ingestion: preview and explicit confirmation, never overwrite existing records.
let pendingNoticeRows=[];
const NOTICE_COLUMNS=['과제명','발주기관','공고번호','사업예산(원)','공고일','마감일','공고출처','공고URL','분야','참여자격'];
function csvEscape(v){const t=String(v??'');return /[",\r\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}
function downloadNoticeTemplate(){
 const sample=['군수 정비체계 연구','예시 발주기관','EX-2026-001','100000000','2026-11-01','2026-11-30','나라장터','https://example.org/notice','군수·MRO','공고문 확인 필요'];
 const csv='\ufeff'+[NOTICE_COLUMNS,sample].map(r=>r.map(csvEscape).join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='NJ_연구과제_공고_입력양식.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
}
function parseNoticeCsv(src){
 const rows=[],row=[];let field='',quoted=false;
 for(let i=0;i<src.length;i++){
  const c=src[i];
  if(quoted){if(c==='"'&&src[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}
  else if(c==='"')quoted=true;
  else if(c===','){row.push(field);field=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&src[i+1]==='\n')i++;row.push(field);if(row.some(v=>v.trim()))rows.push(row.slice());row.length=0;field=''}
  else field+=c;
 }
 if(quoted)throw Error('CSV 따옴표가 닫히지 않았습니다.');
 row.push(field);if(row.some(v=>v.trim()))rows.push(row);
 return rows;
}
function noticeDuplicate(x){
 const n=v=>String(v??'').trim().toLowerCase().replace(/\s+/g,'');
 return db.opportunities.some(y=>(x.noticeNumber&&y.noticeNumber&&n(x.noticeNumber)===n(y.noticeNumber))||(x.url&&y.url&&n(x.url)===n(y.url))||(n(x.title)===n(y.title)&&n(x.agency)===n(y.agency)));
}
async function previewNoticeCsv(input){
 const target=document.getElementById('notice-import-preview');pendingNoticeRows=[];
 if(!input.files?.[0]||!target)return;
 try{
  const file=input.files[0];if(file.size>2*1024*1024)throw Error('CSV는 2MB 이하 파일만 지원합니다.');
  const raw=(await file.text()).replace(/^\ufeff/,'');
  const rows=parseNoticeCsv(raw);if(rows.length<2)throw Error('헤더와 공고 데이터가 필요합니다.');
  const header=rows.shift().map(x=>x.trim());
  if(!header.includes('과제명'))throw Error('필수 열인 과제명이 없습니다. 제공된 입력 양식을 사용해 주세요.');
  if(rows.length>1000)throw Error('한 번에 최대 1,000건까지 가져올 수 있습니다.');
  const get=(r,k)=>r[header.indexOf(k)]?.trim()||'';
  const seen=new Set();
  pendingNoticeRows=rows.map(r=>{
   const x={title:get(r,'과제명'),agency:get(r,'발주기관'),noticeNumber:get(r,'공고번호'),budget:get(r,'사업예산(원)').replace(/[,\s원]/g,''),publishedAt:get(r,'공고일'),due:get(r,'마감일'),sourcePlatform:get(r,'공고출처')||'미지정',url:get(r,'공고URL'),category:get(r,'분야')||'기타',qualificationRequirements:get(r,'참여자격'),status:'모니터링',sourceStatus:'미확인'};
   const key=x.noticeNumber?'n:'+x.noticeNumber.toLowerCase():x.url?'u:'+x.url.toLowerCase():'t:'+x.title.toLowerCase()+'|'+x.agency.toLowerCase();
   x._duplicate=noticeDuplicate(x)||seen.has(key);seen.add(key);
   return x;
  }).filter(x=>x.title);
  const duplicates=pendingNoticeRows.filter(x=>x._duplicate).length;
  const eligible=pendingNoticeRows.length-duplicates;
  target.innerHTML=`<h3>가져오기 미리보기</h3><p>읽은 공고 <b>${pendingNoticeRows.length}건</b> · 기존/파일 내 중복 <b>${duplicates}건</b> · 신규 등록 예정 <b>${eligible}건</b></p><div class="csv-preview-scroll"><table class="table"><thead><tr><th>과제명</th><th>발주기관</th><th>예산</th><th>마감일</th><th>판정</th></tr></thead><tbody>${pendingNoticeRows.slice(0,30).map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.agency)}</td><td>${moneyBudget(x.budget)}</td><td>${esc(x.due)}</td><td>${x._duplicate?'중복 제외':'신규'}</td></tr>`).join('')}</tbody></table></div><p class="subtle">상위 30건만 미리 표시합니다. 가져온 정보는 원문 확인 전까지 미확인 상태입니다.</p><div class="quick"><button class="btn primary" ${eligible?'':'disabled'} onclick="commitNoticeCsv()">신규 ${eligible}건 등록 확정</button><button onclick="pendingNoticeRows=[];document.getElementById('notice-import-preview').innerHTML='<p>가져오기가 취소되었습니다.</p>'">취소</button></div>`;
 }catch(e){target.innerHTML=`<p style="color:#ae3442">CSV 읽기 실패: ${esc(e.message)}</p>`}
 finally{input.value=''}
}
function commitNoticeCsv(){
 if(!pendingNoticeRows.length)return;
 const fresh=pendingNoticeRows.filter(x=>!x._duplicate&&!noticeDuplicate(x));
 if(!fresh.length){alert('신규 등록할 공고가 없습니다.');return}
 if(!confirm(`중복을 제외한 공고 ${fresh.length}건을 연구과제 관리에 추가하시겠습니까?`))return;
 for(const x of fresh){const {_duplicate,...record}=x;db.opportunities.push({...record,id:'csv'+Date.now().toString(36)+Math.random().toString(36).slice(2,9),updated:new Date().toISOString()})}
 pendingNoticeRows=[];save();alert(`${fresh.length}건을 등록했습니다. 연구과제 관리에서 확인해 주세요.`);go('opportunities');
}


nav();render();
